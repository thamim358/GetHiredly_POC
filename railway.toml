[build]
builder = "nixpacks"

[deploy]
startCommand = "python professional_dashboard_api.py"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"

[env]
PORT = "5000"
ENVIRONMENT = "production"
DISPLAY = ":99"
CHROME_BIN = "/usr/bin/google-chrome"
CHROMEDRIVER_PATH = "/usr/bin/chromedriver"