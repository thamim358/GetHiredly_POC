# Nixpacks configuration for Railway.app deployment
# This ensures Chrome and ChromeDriver are properly installed

[phases.setup]
nixPkgs = [
  "python39",
  "python39Packages.pip",
  "google-chrome",
  "chromedriver",
  "xvfb-run",
  "xorg.xvfb",
  "fontconfig",
  "freetype"
]

[phases.install]
cmds = [
  "pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "echo 'Build phase complete'",
  "python -c 'import selenium; print(\"Selenium installed successfully\")' || echo 'Selenium check failed'",
  "google-chrome --version || echo 'Chrome version check failed'",
  "chromedriver --version || echo 'ChromeDriver version check failed'"
]

[start]
cmd = "python professional_dashboard_api.py"